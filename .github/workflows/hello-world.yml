name: Hello World

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions! Commit ${GITHUB_SHA::7} on ${GITHUB_REF}"
