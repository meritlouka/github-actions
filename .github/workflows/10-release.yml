name: 10 - Release

# How to trigger:
#   gh release create v1.0.0 --title "v1.0.0" --notes "First release"
#   (or via the Releases UI -> "Draft a new release" -> Publish)
#   Drafts do NOT fire `published`; you must publish.
#
# Activity types: published, unpublished, created, edited, deleted,
# prereleased, released.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Released ${{ github.event.release.tag_name }}"
