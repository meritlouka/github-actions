name: 02 - Pull Request

# How to trigger:
#   git checkout -b feature/test && git commit --allow-empty -m "x" && git push -u origin feature/test
#   gh pr create --base main --head feature/test --title "Test PR" --body ""
# Re-trigger by pushing more commits (synchronize) or marking ready_for_review:
#   gh pr ready <number>
#
# Activity types: opened, synchronize, reopened, closed, edited, labeled,
# unlabeled, assigned, unassigned, review_requested, review_request_removed,
# ready_for_review, converted_to_draft, locked, unlocked, milestoned, demilestoned,
# auto_merge_enabled, auto_merge_disabled.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "PR #${{ github.event.pull_request.number }} - ${{ github.event.action }}"
