name: 13 - Deployment & Status

# `deployment` fires when a Deployment is created via API.
# `deployment_status` fires when the deployment's status changes.
# `status` fires on commit status updates.
on:
  deployment:
  deployment_status:
  status:

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }} state=${{ github.event.deployment_status.state || github.event.state }}"
