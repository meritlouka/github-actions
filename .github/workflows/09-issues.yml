name: 09 - Issues & Comments

# How to trigger:
#   Open or comment on an issue:
#     gh issue create --title "Test" --body "Triggering workflow"
#     gh issue comment <number> --body "hello"
#     gh issue edit <number> --add-label bug
#
# Issue activity types: opened, edited, deleted, transferred, pinned, unpinned,
# closed, reopened, assigned, unassigned, labeled, unlabeled, locked, unlocked,
# milestoned, demilestoned.
on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: echo "Issue #${{ github.event.issue.number }} action=${{ github.event.action }}"
