name: Perm 02 - Explicit Read-Only

# Best-practice baseline: declare the lowest possible scopes.
# `permissions: read-all` is shorthand for read on every scope.
# Prefer naming scopes explicitly so reviewers see exactly what's granted.
#
# How to trigger:
#   gh workflow run "Perm 02 - Explicit Read-Only"

on:
  workflow_dispatch:

permissions:
  contents: read
  # everything else defaults to "none" because we didn't list them

jobs:
  list-issues:
    runs-on: ubuntu-latest
    steps:
      - name: List 3 most recent issues (read-only API call)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --repo tells `gh` which repo to query without needing a git checkout.
        run: gh issue list --repo ${{ github.repository }} --limit 3 --json number,title,state
