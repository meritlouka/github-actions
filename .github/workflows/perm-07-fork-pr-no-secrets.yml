name: Perm 07 - Forks Don't Get Secrets

# Demonstrates the most important security guarantee:
# `pull_request` runs triggered by a fork do NOT receive repo/org secrets.
# `secrets.DEMO_API_TOKEN` will be empty in fork PR runs.
#
# How to trigger:
#   1. From this repo:      open a PR from a branch in this repo → token IS set.
#   2. From a fork:         fork the repo, open a PR back → token IS NOT set.
# Compare the two run logs.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-secret-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect whether the secret was injected
        env:
          API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::warning::DEMO_API_TOKEN is EMPTY (likely a fork PR)."
            echo "GitHub omitted the secret because this PR came from a fork."
          else
            echo "DEMO_API_TOKEN was injected (length: $(echo -n "$API_TOKEN" | wc -c))."
            echo "This run was triggered from a branch in the base repo."
          fi
