name: Perm 05 - Secrets vs Variables

# Demonstrates the difference between secrets.* and vars.*
#
# Before running, set these in:
#   Settings → Secrets and variables → Actions
#
#   Secrets tab:
#     DEMO_API_TOKEN   = any-string
#   Variables tab:
#     DEMO_REGION      = eu-central-1
#     DEMO_FEATURE_NEW = true
#
# How to trigger:
#   gh workflow run "Perm 05 - Secrets vs Variables"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-config:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.DEMO_REGION }}
      FEATURE_NEW: ${{ vars.DEMO_FEATURE_NEW }}
      API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
    steps:
      - name: Variables are plain-text, safe to print
        run: |
          echo "Region:      $REGION"
          echo "FeatureFlag: $FEATURE_NEW"

      - name: Secrets are masked in logs
        run: |
          echo "Token length: $(echo -n "$API_TOKEN" | wc -c)"
          echo "Echoing the token (GitHub will replace it with ***):"
          echo "$API_TOKEN"

      - name: Common gotcha – masking is exact-match only
        run: |
          # If you transform a secret, the transformed value is NOT masked.
          # Demonstration with base64 – DO NOT do this with real secrets.
          echo "Base64 of token (would leak if this were a real secret):"
          echo -n "$API_TOKEN" | base64
