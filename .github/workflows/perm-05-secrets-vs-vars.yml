name: Perm 05 - Secrets vs Variables

# Demonstrates the difference between secrets.* and vars.*
# This version works out-of-the-box: trigger inputs provide defaults so you
# never see empty strings. If you ALSO configure repo secrets/vars with the
# same names, those values override the inputs (see the env: block below).
#
# Optional repo config (Settings → Secrets and variables → Actions):
#   Secrets:   DEMO_API_TOKEN   = any-string
#   Variables: DEMO_REGION      = eu-central-1
#              DEMO_FEATURE_NEW = true
#
# How to trigger:
#   gh workflow run "Perm 05 - Secrets vs Variables"
#   gh workflow run "Perm 05 - Secrets vs Variables" \
#     -f api_token=my-token -f region=us-west-2 -f feature_new=false

on:
  workflow_dispatch:
    inputs:
      api_token:
        description: 'Pretend secret token (treated as a secret by the masker)'
        type: string
        default: 'demo-token-abcdef123456'
      region:
        description: 'Plain-text config value'
        type: string
        default: 'eu-central-1'
      feature_new:
        description: 'Plain-text feature flag'
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

jobs:
  show-config:
    runs-on: ubuntu-latest
    env:
      # Prefer real secrets/vars when present; fall back to dispatch inputs.
      REGION: ${{ vars.DEMO_REGION || inputs.region }}
      FEATURE_NEW: ${{ vars.DEMO_FEATURE_NEW || inputs.feature_new }}
      API_TOKEN: ${{ secrets.DEMO_API_TOKEN || inputs.api_token }}
    steps:
      - name: Register API_TOKEN as a secret so logs mask it
        # When the value comes from `inputs.*` it is NOT auto-masked.
        # ::add-mask:: tells the runner to treat this exact string as secret
        # in all subsequent log output, matching how `secrets.*` behaves.
        run: echo "::add-mask::$API_TOKEN"

      - name: Variables are plain-text, safe to print
        run: |
          echo "Region:       $REGION"
          echo "Feature flag: $FEATURE_NEW"

      - name: Secrets are masked in logs
        run: |
          echo "Token length: $(echo -n "$API_TOKEN" | wc -c)"
          echo "Echoing the token (GitHub will replace it with ***):"
          echo "$API_TOKEN"

      - name: Common gotcha – masking is exact-match only
        run: |
          # Transforming a secret (base64, json-encode, split) defeats masking.
          # The base64 output below would leak the original value if this
          # were a real secret. Never do this with production tokens.
          echo "Base64 of token (would leak if this were a real secret):"
          echo -n "$API_TOKEN" | base64
