name: 12 - Discussions

# How to trigger:
#   Discussions must be enabled: Repo Settings -> Features -> Discussions.
#   Then create or comment on a discussion via the UI, or:
#     gh api graphql -f query='mutation { createDiscussion(...) { ... } }'
#   `answered` fires when a comment is marked as the answer in Q&A categories.
#
# Activity types: created, edited, deleted, transferred, pinned, unpinned,
# labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered.
on:
  discussion:
    types: [created, answered]
  discussion_comment:
    types: [created]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Discussion event: ${{ github.event.action }}"
