name: 08 - Workflow Run

# How to trigger:
#   Automatic – runs after any workflow listed in `workflows:` completes on the
#   matching branch. To test, push to `main` so "01 - Push" runs; this one
#   will then fire on completion.
#   Note: `workflow_run` workflows only run from the default branch's copy.
#
# Triggers AFTER another workflow finishes. Useful for post-processing,
# notifications, or coordinated pipelines.
on:
  workflow_run:
    workflows: ['01 - Push', '02 - Pull Request']
    types: [completed]
    branches: [main]

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow ${{ github.event.workflow_run.name }} -> ${{ github.event.workflow_run.conclusion }}"
